        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311b92, #0284c7);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        /* Floating Background Decorative Circles */
        
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.08);
            bottom: -160px;
            border-radius: 50%;
            animation: square 20s infinite linear;
        }
        
        .bg-bubbles li:nth-child(1) {
            left: 10%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }
        
        .bg-bubbles li:nth-child(2) {
            left: 20%;
            width: 40px;
            height: 40px;
            animation-delay: 2s;
            animation-duration: 17s;
        }
        
        .bg-bubbles li:nth-child(3) {
            left: 25%;
            width: 60px;
            height: 60px;
            animation-delay: 4s;
        }
        
        .bg-bubbles li:nth-child(4) {
            left: 40%;
            width: 120px;
            height: 120px;
            animation-delay: 0s;
            animation-duration: 22s;
        }
        
        .bg-bubbles li:nth-child(5) {
            left: 70%;
            width: 90px;
            height: 90px;
            animation-delay: 1s;
        }
        
        .bg-bubbles li:nth-child(6) {
            left: 85%;
            width: 100px;
            height: 100px;
            animation-delay: 3s;
        }
        
        @keyframes square {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }
        
        .quiz-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: 100%;
            max-width: 700px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }
        
        h1,
        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }
        
        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        /* Form Controls */
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }
        
        .form-group input:focus {
            border-color: #38bdf8;
        }
        /* Buttons */
        
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }
        
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(22, 163, 74, 0.4);
        }
        
        .btn-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            margin-top: 12px;
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.4);
        }
        /* Progress Bar & Header */
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        /* 15-second Timer Badge Styles */
        
        .timer-badge {
            background-color: #0f172a;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        
        .timer-badge.warning {
            border-color: #ef4444;
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.15);
            animation: pulse 0.8s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #334155;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            transition: width 0.3s ease;
        }
        /* Question & Options */
        
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 22px;
            line-height: 1.5;
        }
        
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option-btn {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .option-btn:hover:not(.disabled) {
            border-color: #38bdf8;
            background-color: #1e293b;
        }
        
        .option-btn.correct {
            background-color: #15803d !important;
            border-color: #22c55e !important;
            color: white !important;
            font-weight: 700;
        }
        
        .option-btn.incorrect {
            background-color: #b91c1c !important;
            border-color: #ef4444 !important;
            color: white !important;
            font-weight: 700;
        }
        
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.9;
        }
        /* Results Screen */
        
        .result-box {
            text-align: center;
            padding: 10px 0;
        }
        
        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #16a34a, #0d9488);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 25px rgba(22, 163, 74, 0.4);
        }
        
        .score-number {
            font-size: 2.4rem;
            font-weight: 800;
        }
        
        .score-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Answer Review Styles */
        
        .review-list {
            margin-top: 25px;
            text-align: left;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .review-item {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        
        .review-item.correct-border {
            border-left: 5px solid #22c55e;
        }
        
        .review-item.incorrect-border {
            border-left: 5px solid #ef4444;
        }
        
        .review-q-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .review-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .badge-correct {
            background-color: #22c55e;
            color: white;
        }
        
        .badge-incorrect {
            background-color: #ef4444;
            color: white;
        }
        
        .ans-text {
            font-size: 0.9rem;
            margin-top: 4px;
        }
        
        .text-green {
            color: #4ade80;
            font-weight: 600;
        }
        
        .text-red {
            color: #f87171;
            font-weight: 600;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>

            <form onsubmit="startQuiz(event)">

                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="userRoll">Roll Number / Hostel Room</label>
                    <input type="text" id="userRoll" placeholder="e.g., 23341021 or Yamuna Hostel" required>
                </div>
                <button type="submit" class="btn-main">Start Quiz Now</button>
            </form>
        </div>

        <!-- 2. QUIZ QUESTIONS SCREEN -->
        <div id="quizScreen" class="hidden">
            <div class="progress-header">
                <span>Question <strong id="currentQuestionNum">1</strong> of 20</span>
                <span class="timer-badge" id="timerDisplay">⏱️ 15s</span>
                <span id="displayStudentName">Student</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>

            <div class="question-text" id="questionText">Loading Question...</div>

            <div class="options-grid" id="optionsContainer">
                <!-- Dynamic Options Inject Here -->
            </div>

            <button id="nextBtn" class="btn-main" onclick="nextQuestion()" style="margin-top:25px;" disabled>Next Question</button>
        </div>

        <!-- 3. FINAL RESULTS SCREEN -->
        <div id="resultScreen" class="hidden">
            <div class="result-box">
                <h2>Quiz Completed!</h2>
                <p class="subtitle">Great effort, <strong id="resultName">User</strong> (<span id="resultRoll">Details</span>)!</p>

                <div class="score-circle">
                    <div class="score-number" id="finalScore">0/20</div>
                    <div class="score-label">Final Score</div>
                </div>

                <p id="resultMessage" style="color:#cbd5e1; margin-bottom:15px;"></p>

                <!-- View Detailed Answer Score Breakdown Button -->
                <button class="btn-main btn-secondary" id="viewAnswersBtn" onclick="toggleReview()">View Answers Review</button>
                <button class="btn-main" onclick="resetQuiz()">Retake Quiz (New Questions)</button>

                <!-- Answer Review Section -->
                <div id="reviewContainer" class="review-list hidden">
                    <!-- Dynamic Breakdown List -->
                </div>
            </div>
        </div>

        // State Variables
        let activeQuestions = [];
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;
        let timerInterval = null;
        let timeLeft = 15;
        let userData = {
            name: "",
            roll: ""
        };

        // Helper: Shuffle Array (Fisher-Yates)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 1. START QUIZ
        function startQuiz(e) {
            e.preventDefault();

            userData.name = document.getElementById("userName").value.trim();
            userData.roll = document.getElementById("userRoll").value.trim();

            // Shuffle 100 questions and pick top 20
            activeQuestions = shuffleArray(mainQuestionPool).slice(0, 20);
            userAnswers = new Array(20).fill(null);

            currentQuestionIndex = 0;
            score = 0;

            document.getElementById("userFormScreen").classList.add("hidden");
            document.getElementById("quizScreen").classList.remove("hidden");
            document.getElementById("displayStudentName").innerText = userData.name;

            loadQuestion();
        }

        // TIMER ENGINE: 15 seconds per question
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            const timerEl = document.getElementById("timerDisplay");
            timerEl.innerText = `⏱️ ${timeLeft}s`;
            timerEl.classList.remove("warning");

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = `⏱️ ${timeLeft}s`;

                if (timeLeft <= 5) {
                    timerEl.classList.add("warning");
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        // Timeout handler when time reaches 0
        function handleTimeOut() {
            isAnswered = true;
            const currentQ = activeQuestions[currentQuestionIndex];
            const allOptions = document.querySelectorAll(".option-btn");

            allOptions.forEach((btn, idx) => {
                btn.classList.add("disabled");
                if (idx === currentQ.answer) {
                    btn.classList.add("correct");
                }
            });

            userAnswers[currentQuestionIndex] = null; // Unanswered due to timeout
            document.getElementById("nextBtn").disabled = false;
        }

        // 2. LOAD QUESTION
        function loadQuestion() {
            selectedOptionIndex = null;
            isAnswered = false;

            const nextBtn = document.getElementById("nextBtn");
            nextBtn.disabled = true;
            nextBtn.innerText = (currentQuestionIndex === 19) ? "Submit Quiz" : "Next Question";

            const currentQ = activeQuestions[currentQuestionIndex];

            document.getElementById("currentQuestionNum").innerText = currentQuestionIndex + 1;
            const progressPercent = (currentQuestionIndex / 20) * 100;
            document.getElementById("progressBarFill").style.width = `${progressPercent}%`;

            document.getElementById("questionText").innerText = `${currentQuestionIndex + 1}. ${currentQ.question}`;

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((optText, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optText;
                btn.onclick = () => selectOption(idx, btn);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        // 3. SELECT OPTION & SHOW INSTANT FEEDBACK
        function selectOption(index, element) {
            if (isAnswered) return; // Prevent changing answer
            isAnswered = true;

            clearInterval(timerInterval); // Stop timer on selection

            selectedOptionIndex = index;
            userAnswers[currentQuestionIndex] = index;

            const currentQ = activeQuestions[currentQuestionIndex];
            const allOptions = document.querySelectorAll(".option-btn");

            // Disable all option buttons and highlight correct/incorrect
            allOptions.forEach((btn, idx) => {
                btn.classList.add("disabled");
                if (idx === currentQ.answer) {
                    btn.classList.add("correct"); // Highlight correct answer in green
                }
            });

            if (index !== currentQ.answer) {
                element.classList.add("incorrect"); // Highlight user's wrong answer in red
            } else {
                score++;
            }

            document.getElementById("nextBtn").disabled = false;
        }

        // 4. NEXT QUESTION
        function nextQuestion() {
            clearInterval(timerInterval);
            currentQuestionIndex++;

            if (currentQuestionIndex < 20) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // 5. SHOW RESULTS
        function showResults() {
            clearInterval(timerInterval);
            document.getElementById("quizScreen").classList.add("hidden");
            document.getElementById("resultScreen").classList.remove("hidden");

            document.getElementById("resultName").innerText = userData.name;
            document.getElementById("resultRoll").innerText = userData.roll;
            document.getElementById("finalScore").innerText = `${score}/20`;

            const percentage = (score / 20) * 100;
            document.getElementById("resultMessage").innerText = `You scored ${percentage}% on this attempt! Click below to review your answers.`;

            buildReviewList();
        }

        // 6. BUILD DETAILED ANSWER REVIEW
        function buildReviewList() {
            const reviewContainer = document.getElementById("reviewContainer");
            reviewContainer.innerHTML = "";

            activeQuestions.forEach((q, idx) => {
                        const userChoiceIdx = userAnswers[idx];
                        const isCorrect = (userChoiceIdx === q.answer);

                        const item = document.createElement("div");
                        item.className = `review-item ${isCorrect ? 'correct-border' : 'incorrect-border'}`;

                        const badgeClass = isCorrect ? 'badge-correct' : 'badge-incorrect';
                        const badgeText = isCorrect ? 'Correct' : 'Incorrect';

                        const userText = userChoiceIdx !== null ? q.options[userChoiceIdx] : "Not Answered (Timed Out)";
                        const correctText = q.options[q.answer];

                        item.innerHTML = `
                    <span class="review-badge ${badgeClass}">${badgeText}</span>
                    <div class="review-q-title">${idx + 1}. ${q.question}</div>
                    <div class="ans-text">Your Answer: <span class="${isCorrect ? 'text-green' : 'text-red'}">${userText}</span></div>
                    ${!isCorrect ? `<div class="ans-text">Correct Answer: <span class="text-green">${correctText}</span></div>` : ''}
                `;

                reviewContainer.appendChild(item);
            });
        }

        // TOGGLE REVIEW LIST VISIBILITY
        function toggleReview() {
            const reviewContainer = document.getElementById("reviewContainer");
            const btn = document.getElementById("viewAnswersBtn");
            if (reviewContainer.classList.contains("hidden")) {
                reviewContainer.classList.remove("hidden");
                btn.innerText = "Hide Answers Review";
            } else {
                reviewContainer.classList.add("hidden");
                btn.innerText = "View Answers Review";
            }
        }

        // RESET QUIZ
        function resetQuiz() {
            clearInterval(timerInterval);
            document.getElementById("resultScreen").classList.add("hidden");
            document.getElementById("reviewContainer").classList.add("hidden");
            document.getElementById("userFormScreen").classList.remove("hidden");
            document.getElementById("userName").value = "";
            document.getElementById("userRoll").value = "";
        }
    </script>
